<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KONTENT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--y:#4FBF5E;--q:#151515;--q2:#1d1d1d;--q3:#262626;--k:#8f9a92;--r:#ff6b6b;--s:#ffcc4d;--ln:#2b2b2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:#080a08;color:#fff;font-size:14px;padding-bottom:84px;background-attachment:fixed;
 background-image:radial-gradient(520px 320px at 100% -40px,rgba(79,191,94,.20),transparent 70%),radial-gradient(420px 300px at -10% 100%,rgba(255,255,255,.05),transparent 70%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><path d='M0 44 44 0' stroke='%234FBF5E' stroke-opacity='.07' stroke-width='1.2'/><path d='M22 17v10M17 22h10' stroke='%23ffffff' stroke-opacity='.06' stroke-width='1.4' fill='none'/></svg>")}
.top{position:sticky;top:0;z-index:5;background:rgba(8,10,8,.92);backdrop-filter:blur(8px);padding:12px 14px 8px;display:flex;align-items:center;gap:10px}
.lg{height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;color:#0a0a0a;font-weight:900;font-size:13px;letter-spacing:.06em;flex:none;padding:0 9px;border-bottom:3px solid var(--y)}
.top b{font-size:16px}.top small{display:block;color:var(--k);font-size:11.5px}
.top .rf{margin-left:auto;background:var(--q3);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:13px}
main{padding:0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:var(--q3);color:#ddd;font-size:12.5px;border:0;font:inherit;font-size:12.5px}
.chip.on{background:var(--y);color:var(--q);font-weight:700}
.dr{display:none;gap:8px;margin:0 0 8px}.dr.on{display:flex}.dr label{flex:1;font-size:11px;color:var(--k)}
input,select{width:100%;background:#111;border:1px solid #333;border-radius:12px;color:#fff;padding:10px 12px;font-size:14px;font-family:inherit;margin:4px 0;color-scheme:dark}
.card{background:rgba(22,26,22,.88);border:1px solid #263026;border-radius:16px;padding:12px 14px;margin:0 0 10px}
.card h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--k);text-transform:uppercase;letter-spacing:.4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:rgba(22,26,22,.88);border:1px solid #263026;border-radius:16px;padding:11px 12px}.tile .k{color:var(--k);font-size:11.5px}.tile .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}.tile .s{font-size:11.5px;color:var(--k);margin-top:1px}
.bar{height:7px;background:#2c2c2c;border-radius:4px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y);border-radius:4px}.bar i.w{background:var(--s)}.bar i.b{background:var(--r)}
.item{background:rgba(22,26,22,.88);border:1px solid #263026;border-radius:16px;padding:11px 13px;margin-bottom:8px}
.item .tp{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--k)}.item .t{margin:4px 0 6px;font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:rgba(79,191,94,.16);color:var(--y)}.pill.w{background:rgba(255,204,77,.16);color:var(--s)}.pill.b{background:rgba(255,107,107,.16);color:var(--r)}
.m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-variant-numeric:tabular-nums}.m span{color:var(--k)}.m b{color:#fff;font-weight:600}
.lnk{color:var(--y);font-size:13px;text-decoration:none;display:inline-block;margin-top:6px}
.ok{color:var(--y)}.warn{color:var(--s)}.bad{color:var(--r)}.muted{color:var(--k)}
.empty{text-align:center;color:var(--k);padding:28px 10px}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--k);margin:2px 2px 10px}.sum b{color:#fff}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}.row:first-child{border-top:0}
.hm{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}.hm i{aspect-ratio:1;border-radius:5px;background:#2a2a2a;display:block}.hm i.g{background:var(--y)}.hm i.y{background:var(--s)}.hm i.r{background:var(--r)}
.cols{display:flex;align-items:flex-end;gap:3px;height:96px}.cols i{flex:1;background:var(--y);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.hb{display:flex;gap:6px;align-items:center;font-size:12.5px;margin:5px 0}.hb span{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ddd}.hb div{flex:1;height:8px;background:#2c2c2c;border-radius:4px;overflow:hidden}.hb div i{display:block;height:100%;background:var(--y)}.hb b{width:54px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:var(--y);color:var(--q);font-weight:800;font-size:14px;margin:8px 0}.btn.g{background:var(--q3);color:#fff;font-weight:600}
.msgs{padding-bottom:6px}.msg{max-width:88%;padding:9px 12px;border-radius:16px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.msg.me{margin-left:auto;background:var(--y);color:var(--q);border-bottom-right-radius:5px;font-weight:600}.msg.bot{background:var(--q2);border:1px solid var(--ln);border-bottom-left-radius:5px}.msg.wait{color:var(--k)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.sugg button{border:1px solid var(--ln);background:var(--q2);color:#ddd;border-radius:16px;padding:7px 12px;font:inherit;font-size:13px;text-align:left}
.ask{position:sticky;bottom:78px;display:flex;gap:8px;padding:8px 0;background:linear-gradient(transparent,#0d0d0d 30%)}
.ask textarea{flex:1;resize:none;border:1px solid #333;border-radius:18px;padding:10px 14px;font:inherit;background:#111;color:#fff;max-height:110px}
.ask button{border:0;background:var(--y);color:var(--q);border-radius:50%;width:44px;height:44px;font-size:18px;font-weight:800;flex:none}.ask button:disabled{opacity:.5}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,10,.97);border-top:1px solid #222;padding:6px 2px calc(10px + env(safe-area-inset-bottom));z-index:9}
.tab button{flex:1;background:none;border:0;color:#8a8a8a;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}.tab button em{font-style:normal;font-size:19px}.tab button.on{color:var(--y);font-weight:700}
.tab button.ai em{background:var(--y);border-radius:16px;padding:5px 12px;margin-top:-16px;box-shadow:0 4px 14px rgba(79,191,94,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:20}.modal>div{background:#181818;width:100%;border-radius:22px 22px 0 0;padding:16px;max-height:88vh;overflow:auto}
.yuk{text-align:center;color:var(--k);padding:60px 20px}.err{background:#3a1515;border:1px solid #702828;color:#ffb3b3;border-radius:12px;padding:10px;margin:8px 0}
#yan{position:fixed;top:6px;right:8px;z-index:50;font-size:11px;padding:2px 8px;border-radius:10px;background:#1b7a43;color:#fff;opacity:.92;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="yan">🔄 yangilanmoqda…</div>
<div class="top"><div class="lg">ALLMAX</div><div><b>KONTENT</b><small id="sub">yuklanmoqda…</small></div><button class="rf" id="rf">↻</button></div>
<main id="ek"><div class="yuk">⏳ yuklanmoqda…</div></main>
<nav class="tab" id="tab"></nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#080a08'); tg.setBackgroundColor('#080a08'); } catch (e) {} }
const API = new URLSearchParams(location.search).get('api') || (() => { try { return localStorage.getItem('kb_api') || ''; } catch (e) { return ''; } })();
try { if (new URLSearchParams(location.search).get('api')) localStorage.setItem('kb_api', API); } catch (e) {}
const TZ = 'Asia/Tashkent', $ = id => document.getElementById(id);
let D = null, BET = 'asosiy', SORT = {};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = x => typeof x === 'number' && isFinite(x) ? x : 0;
const n0 = x => (typeof x === 'number' && isFinite(x)) ? Math.round(x).toLocaleString('ru-RU') : '—';
const pr = x => (typeof x === 'number' && isFinite(x)) ? Math.round(x * 100) + '%' : '—';
const sgn = x => (typeof x === 'number' && isFinite(x)) ? (x > 0 ? '+' : '') + n0(x) : '—';
const kunKey = ms => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms));
const dm = ms => new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, day: '2-digit', month: '2-digit' }).format(new Date(ms));
const dmhm = ms => new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(ms)).replace(',', '');
const KUN = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const kunNomi = k => KUN[new Date(k + 'T12:00:00Z').getUTCDay()];
const rows = t => t && t.ust ? t.q.map(r => { const o = {}; t.ust.forEach((u, i) => o[u] = r[i]); return o; }) : [];
const qosh = (k, n) => new Date(Date.parse(k + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const open = u => { if (!u) return; if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); };
const tile = (k, v, s, f) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}${typeof f === 'number' && isFinite(f) ? `<div class="bar"><i class="${f < .6 ? 'b' : f < .9 ? 'w' : ''}" style="width:${Math.min(100, Math.round(f * 100))}%"></i></div>` : ''}</div>`;
const sana2 = k => k.slice(8) + '.' + k.slice(5, 7);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// ---------- DAVR (hamma bo'limlar uchun bitta) ----------
const DAVR = [['bugun', 'Bugun'], ['kecha', 'Kecha'], ['7', '7 kun'], ['30', '30 kun'], ['oy', 'Shu oy'], ['ooy', "O'tgan oy"], ['oz', '📅 Sana']];
let dv = (() => { try { return JSON.parse(lsGet('kb_davr') || 'null'); } catch (e) { return null; } })() || { d: '7', dan: '', gacha: '' };
function davr() {
  const t = kunKey(Date.now()), oy1 = t.slice(0, 8) + '01', ooy = qosh(oy1, -1);
  const m = { bugun: [t, t], kecha: [qosh(t, -1), qosh(t, -1)], '7': [qosh(t, -6), t], '30': [qosh(t, -29), t], oy: [oy1, t], ooy: [ooy.slice(0, 8) + '01', ooy], oz: [dv.dan || qosh(t, -29), dv.gacha || t] };
  let [a, b] = m[dv.d] || m['7']; if (a > b) [a, b] = [b, a]; return [a, b];
}
const kunlar = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5) + 1;
const inD = (ms, a, b) => { const k = kunKey(ms); return k >= a && k <= b; };
function davrHtml() {
  const [a, b] = davr();
  return `<div class="chips" id="dch">${DAVR.map(d => `<button class="chip ${dv.d === d[0] ? 'on' : ''}" data-d="${d[0]}">${d[1]}</button>`).join('')}</div>
  <div class="dr ${dv.d === 'oz' ? 'on' : ''}" id="ddr"><label>Dan<input type="date" id="dan" value="${a}"></label><label>Gacha<input type="date" id="gacha" value="${b}"></label></div>
  <div class="muted" style="font-size:12px;margin:0 2px 8px">${sana2(a)} – ${sana2(b)} · ${kunlar(a, b)} kun</div>`;
}
function davrUlash() {
  $('dch').onclick = e => { const x = e.target.closest('button'); if (!x) return; dv.d = x.dataset.d; lsSet('kb_davr', JSON.stringify(dv)); chiz(); };
  const f = () => { dv.dan = $('dan').value; dv.gacha = $('gacha').value; lsSet('kb_davr', JSON.stringify(dv)); chiz(true); };
  if ($('dan')) { $('dan').onchange = f; $('gacha').onchange = f; }
}

// ---------- SERVER (oxirgi holat darhol, yangisi orqada) ----------
async function api(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ ilova: 1, initData: tg ? tg.initData : '' }, body)) });
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { throw new Error('HTTP ' + r.status + ' · ' + (/<html|<!doctype/i.test(t) ? "server JSON o'rniga sahifa qaytardi (Apps Script'da yangi versiya kerak)" : t.slice(0, 120))); }
}
function prep(d) { d.R = rows(d.reels); d.S = rows(d.story); d.J = rows(d.reja); d.K = rows(d.kunlik).filter(o => o.Sana).sort((a, b) => a.Sana - b.Sana); d.Z = rows(d.dizayn); return d; }
async function yangila(jim, majbur) {
  if (!API) return fail("Ilova manzili to'liq emas. Botdagi «📊 KONTENT» tugmasi orqali oching.");
  if (!tg || !tg.initData) return fail("Bu ilova faqat Telegram ichida ishlaydi — botdagi tugmani bosing.");
  $('yan').style.display = 'block';
  try {
    const j = await api({ amal: 'hammasi', yangi: majbur ? 1 : 0 });
    if (j.xato) { $('yan').style.display = 'none'; return jim && D ? 0 : fail(j.xato); }
    const eski = D && D.vaqt;
    D = prep(j); lsSet('kb_D', JSON.stringify(j));
    $('sub').textContent = (D.ism || '') + ' · ' + D.rol + ' · ' + dmhm(D.vaqt);
    if (!eski || eski !== D.vaqt) { nav(); chiz(); }
  } catch (e) { if (!D) fail("Server bilan aloqa bo'lmadi.\n" + e.message); }
  $('yan').style.display = 'none';
}
function fail(t) { $('ek').innerHTML = '<div class="yuk">⚠️<br><br>' + esc(t).replace(/\n/g, '<br>') + '</div>'; }

// ---------- NAVIGATSIYA ----------
const T = d => { const E = d.rol === 'Ega', A = d.rol === 'Admin', M = d.rol === 'Mobilograf', S = d.rol === 'Storismaker', Z = d.rol === 'Dizayner';
  return [['asosiy', '🏠', 'Asosiy', !Z], ['reels', '🎬', 'Reels', !!d.reels], ['story', '📱', 'Story', !!d.story], ['dizayn', '🎨', 'Dizayn', !!d.dizayn], ['ai', '🤖', 'AI', true], ['koproq', '☰', "Ko'proq", true]]
    .filter(x => x[3]); };
function nav() {
  const list = T(D); if (!list.some(x => x[0] === BET)) BET = list[0][0];
  $('tab').innerHTML = list.map(x => `<button data-t="${x[0]}" class="${x[0] === 'ai' ? 'ai ' : ''}${x[0] === BET ? 'on' : ''}"><em>${x[1]}</em>${x[2]}</button>`).join('');
}
$('tab').onclick = e => { const b = e.target.closest('button'); if (!b) return; BET = b.dataset.t; nav(); chiz(); window.scrollTo(0, 0); if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); };
$('rf').onclick = () => yangila(true, true);
const BOL = { asosiy, reels, story, dizayn, ai, koproq, reja, obunachi, tizim, qollanma };
function chiz(saqla) {
  if (!D) return; const y = window.scrollY;
  try { $('ek').innerHTML = BOL[BET](); } catch (e) { $('ek').innerHTML = '<div class="err">❌ ' + esc(e.message) + '</div>'; }
  if (BET !== 'ai') { if ($('dch')) davrUlash(); } else aiUlash();
  if (BET === 'reels' || BET === 'story') filtrUlash();
  if (saqla || BET !== 'ai') window.scrollTo(0, saqla ? y : 0);
  if (BET === 'koproq') koproqUlash();
}

// ---------- ASOSIY ----------
function bk() {
  const t = kunKey(Date.now()), k = qosh(t, -1), say = (L, d) => L.filter(o => kunKey(o.Sana) === d).length;
  const kr = d => D.K.find(o => kunKey(o.Sana) === d) || {};
  const nr = d => d === t ? D.norma.reels : (typeof kr(d)['Reels reja'] === 'number' ? kr(d)['Reels reja'] : null), ns = d => d === t ? D.norma.story : (typeof kr(d)['Story reja'] === 'number' ? kr(d)['Story reja'] : null);
  const z = d => D.Z.filter(o => kunKey(o.Sana) === d).reduce((x, o) => x + num(o['Dizaynlar soni']), 0);
  const blok = (nom, d) => { const r = D.R ? say(D.R, d) : null, s = D.S ? say(D.S, d) : null, a = nr(d), b = ns(d);
    const q = (e, v, n) => v == null ? '' : `<div style="flex:1;min-width:0"><div class="muted" style="font-size:11px">${e}</div><div style="font-size:22px;font-weight:800">${v}${n ? `<span class="muted" style="font-size:13px;font-weight:600"> / ${n}</span>` : ''}</div></div>`;
    return `<div style="flex:1;min-width:0;background:rgba(22,26,22,.88);border:1px solid #263026;border-radius:16px;padding:10px 12px"><div style="font-size:12px;font-weight:700;color:var(--y);margin-bottom:6px">${nom} · ${sana2(d)}</div><div style="display:flex;gap:8px">${q('Reels', r, a)}${q('Story', s, b)}${D.dizayn ? q('Dizayn', z(d), 0) : ''}</div></div>`; };
  return `<div style="display:flex;gap:8px;margin-bottom:10px">${blok('Bugun', t)}${blok('Kecha', k)}</div>`;
}
function asosiy() {
  const [a, b] = davr();
  if (D.K.length && (D.rol === 'Ega' || D.rol === 'Admin')) {
    const L = D.K.filter(o => inD(o.Sana, a, b)), s = u => L.reduce((x, o) => x + num(o[u]), 0), son = L.length || 1;
    const ok = ((r, p) => { const q = L.filter(o => typeof o[r] === 'number'); return q.length ? q.reduce((x, o) => x + o[r], 0) / q.length : null; });
    const Z = D.Z.filter(o => inD(o.Sana, a, b)), zj = Z.reduce((x, o) => x + num(o['Dizaynlar soni']), 0);
    const oxirgi = [...D.K].reverse().find(o => typeof o['Jami obunachi'] === 'number' && o.Sana <= Date.parse(b + 'T23:59:59Z')) || {};
    const heat = L.map(o => { const r = Math.min(num(o['Reels %']), num(o['Story %']) || num(o['Reels %'])); const p = Math.min(typeof o['Reels %'] === 'number' ? o['Reels %'] : 1, typeof o['Story %'] === 'number' ? o['Story %'] : 1); return `<i class="${p >= 1 ? 'g' : p >= .7 ? 'y' : 'r'}" title="${dm(o.Sana)}"></i>`; }).join('');
    const kor = L.map(o => num(o["Reels ko'rishlari"])), mx = Math.max(1, ...kor);
    const kk = ((arr) => arr.reduce((m, o) => (m[o['Kontent turi'] || '—'] = (m[o['Kontent turi'] || '—'] || 0) + 1, m), {}))(D.R.filter(o => inD(o.Sana, a, b) && !String(o['Kontent turi'] || '').trim()));
    const yoqR = D.R.filter(o => inD(o.Sana, a, b) && !String(o['Kontent turi'] || '').trim()).length, yoqS = D.S.filter(o => inD(o.Sana, a, b) && !String(o['Story turi'] || '').trim()).length;
    return bk() + davrHtml() + `<div class="tiles">
      ${tile('Reels', n0(s('Reels')) + ' / ' + n0(s('Reels reja')), pr(s('Reels') / (s('Reels reja') || 1)) + ' reja', s('Reels') / (s('Reels reja') || 1))}
      ${tile('Story', n0(s('Story')) + ' / ' + n0(s('Story reja')), pr(s('Story') / (s('Story reja') || 1)) + ' reja', s('Story') / (s('Story reja') || 1))}
      ${tile("Reels ko'rishlari", n0(s("Reels ko'rishlari")), "kuniga o'rtacha " + n0(s("Reels ko'rishlari") / son))}
      ${tile("Story ko'rishlari", n0(s("Story ko'rishlari")), "kuniga o'rtacha " + n0(s("Story ko'rishlari") / son))}
      ${tile('Dizayn', n0(zj) + ' ta', Z.length ? 'kuniga ' + (zj / son).toFixed(1) : "ma'lumot yo'q")}
      ${tile('Instagram', n0(oxirgi['Jami obunachi']), "davrda " + sgn(s("O'sish")))}</div>
      <div class="card"><h3>Kunlar xaritasi</h3><div class="hm">${heat || '—'}</div><div class="muted" style="font-size:11.5px;margin-top:6px">yashil — norma bajarilgan · sariq — 70% dan yuqori · qizil — kam</div></div>
      <div class="card"><h3>Reels ko'rishlari · kunlar</h3><div class="cols">${kor.map((v, i) => `<i style="height:${Math.round(v / mx * 100)}%" title="${dm(L[i].Sana)} · ${n0(v)}"></i>`).join('')}</div></div>

  const bel = { OK: '✅', DIQQAT: '⚠️', XATO: '⛔' };
  return back() + davrHtml() + `<div class="tiles">${tile('Tizim holati', (bel[t.holat] || '') + ' ' + esc(t.holat), t.vaqt ? 'tekshirildi ' + dmhm(t.vaqt) : '')}${tile('Bugungi ish vaqti', t.ish + ' / ' + t.limit, 'daqiqa' + (t.pauza ? ' · pauza' : ''), t.ish / (t.limit || 1))}${tile('AI xarajat', '$' + jami.toFixed(2), 'davrda (shu oy ichida)')}${tile('Bot odamlari', D.odamlar.length, 'ta')}</div>
    <div class="card"><h3>Muammolar</h3>${t.muammo.length ? t.muammo.map(x => `<div class="row"><div>${bel[x.holat] || '•'}</div><div><b>${esc(x.nom)}</b><div class="muted" style="font-size:13px">${esc(x.tashxis)}${x.kim ? ' — ' + esc(x.kim) : ''}</div></div></div>`).join('') : '<div class="ok">Hammasi joyida</div>'}</div>
    <div class="card"><h3>AI xarajat · vazifa bo'yicha</h3>${Object.keys(m).sort((x, y) => m[y] - m[x]).map(k => `<div class="row"><div style="flex:1">${esc(k)}</div><b>$${m[k].toFixed(2)}</b></div>`).join('') || '<div class="muted">Yo\'q</div>'}</div>
    <div class="card"><h3>Bot odamlari</h3>${D.odamlar.map(o => `<div class="row"><div style="flex:1">${esc(o.ism)} <span class="muted">${esc(o.username || '')}</span></div><span class="pill">${esc(o.rol)}</span></div>`).join('')}</div>`;
}

// ---------- AI ----------
const SUGG = { Ega: ["Oxirgi 7 kunda dizayner nechta dizayn qildi?", "Turi yo'q reelslarni ko'rsat", "Nega xato bor?"], Admin: ["Bu hafta nechta reels joylandi?"], Mobilograf: ["Bugun nechta reels qoldi?", "Eng yaxshi reelsim qaysi?"], Storismaker: ["Bugun nechta story qoldi?"], Dizayner: ["Bu oy nechta dizayn qildim?"] };
let MSG = [];
function ai() {
  return `<div class="msgs" id="msgs">${MSG.length ? MSG.map(m => `<div class="msg ${m[0]}">${esc(m[1])}</div>`).join('') : `<div class="msg bot">Salom${D.ism ? ', ' + esc(D.ism) : ''}! Istalgan savolni yozing — bazadan topib, hisoblab beraman. Davrni o'zingiz yozing: «3-noyabrdan 20-noyabrgacha…».\nO'zgartirish kerak bo'lgan amallar (tur belgilash, eslatma) tasdiq tugmasi bilan botda bajariladi.</div><div class="sugg">${(SUGG[D.rol] || []).map(s => `<button>${esc(s)}</button>`).join('')}</div>`}</div>
    <div class="ask"><textarea id="q" rows="1" placeholder="Savol yozing…"></textarea><button id="send" aria-label="Yuborish">➤</button></div>`;
}
let band = false;
function aiUlash() {
  $('send').onclick = () => yubor($('q').value);
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); yubor($('q').value); } });
  $('q').addEventListener('input', () => { $('q').style.height = 'auto'; $('q').style.height = Math.min(110, $('q').scrollHeight) + 'px'; });
  document.querySelectorAll('.sugg button').forEach(b => b.onclick = () => yubor(b.textContent));
}
async function yubor(t) {
  t = String(t || '').trim(); if (!t || band) return; band = true;
  MSG.push(['me', t]); MSG.push(['bot wait', '🤖 bazadan qidiryapman…']); chiz(true); window.scrollTo(0, document.body.scrollHeight);
  let j; try { const r = await api({ amal: 'savol', savol: t }); j = r.javob || r.xato || 'Javob kelmadi.'; } catch (e) { j = "Aloqa uzildi. Qayta yuboring."; }
  MSG[MSG.length - 1] = ['bot', j]; band = false; if (BET === 'ai') { chiz(true); window.scrollTo(0, document.body.scrollHeight); }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
